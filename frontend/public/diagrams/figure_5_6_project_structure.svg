<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720" width="950" height="720">
  <defs>
    <!-- Folder Icon -->
    <g id="folder-icon">
      <path d="M 2 4 L 8 4 L 11 7 L 20 7 A 2 2 0 0 1 22 9 L 22 17 A 2 2 0 0 1 20 19 L 2 19 A 2 2 0 0 1 0 17 L 0 6 A 2 2 0 0 1 2 4 Z" fill="#3b82f6" />
    </g>
    <!-- File Icon -->
    <g id="file-icon">
      <path d="M 3 2 L 11 2 L 16 7 L 16 19 A 2 2 0 0 1 14 21 L 3 21 A 2 2 0 0 1 1 19 L 1 4 A 2 2 0 0 1 3 2 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2" />
      <path d="M 11 2 L 11 7 L 16 7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
    </g>
    <!-- Code / Solidity File Icon -->
    <g id="sol-icon">
      <path d="M 3 2 L 11 2 L 16 7 L 16 19 A 2 2 0 0 1 14 21 L 3 21 A 2 2 0 0 1 1 19 L 1 4 A 2 2 0 0 1 3 2 Z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" />
      <path d="M 11 2 L 11 7 L 16 7" fill="#a7f3d0" stroke="#10b981" stroke-width="1" />
    </g>
    <!-- React JSX Icon -->
    <g id="jsx-icon">
      <path d="M 3 2 L 11 2 L 16 7 L 16 19 A 2 2 0 0 1 14 21 L 3 21 A 2 2 0 0 1 1 19 L 1 4 A 2 2 0 0 1 3 2 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" />
      <path d="M 11 2 L 11 7 L 16 7" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1" />
    </g>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="720" fill="#ffffff" />
  
  <!-- Outer Window Container -->
  <rect x="25" y="20" width="900" height="650" rx="12" ry="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))" />
  
  <!-- Window Header Bar -->
  <path d="M 25 32 A 12 12 0 0 1 37 20 L 913 20 A 12 12 0 0 1 925 32 L 925 55 L 25 55 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="45" cy="37" r="4.5" fill="#ef4444" />
  <circle cx="60" cy="37" r="4.5" fill="#f59e0b" />
  <circle cx="75" cy="37" r="4.5" fill="#10b981" />
  <text x="475" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">
    PoolPass Project Repository File Structure
  </text>

  <!-- Main File Tree Content -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12" fill="#0f172a" transform="translate(45, 80)">
    
    <!-- Root Folder -->
    <use href="#folder-icon" x="0" y="0" />
    <text x="28" y="15" font-weight="bold" fill="#0f172a">poolpass/</text>

    <!-- Branch: contracts/ -->
    <path d="M 10 24 L 10 135 L 25 135" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 10 50 L 25 50" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#folder-icon" x="25" y="38" />
    <text x="53" y="53" font-weight="bold" fill="#0f172a">contracts/</text>
    <text x="260" y="53" fill="#64748b"># Smart contract suite (Solidity 0.8.20)</text>

    <path d="M 35 62 L 35 125 L 50 125" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 35 75 L 50 75" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#sol-icon" x="50" y="63" />
    <text x="73" y="77" fill="#059669">MockERC20.sol</text>
    <text x="260" y="77" fill="#64748b"># 18-decimal test token (mUSDC) with faucet</text>

    <path d="M 35 100 L 50 100" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#sol-icon" x="50" y="88" />
    <text x="73" y="102" fill="#059669">MockYieldPool.sol</text>
    <text x="260" y="102" fill="#64748b"># Simulated Aave/Compound linear lending yield</text>

    <use href="#sol-icon" x="50" y="113" />
    <text x="73" y="127" font-weight="bold" fill="#059669">PoolPass.sol</text>
    <text x="260" y="127" fill="#64748b"># Core staking, custom plans, timelocks, settlement</text>

    <!-- Branch: scripts/ -->
    <path d="M 10 160 L 25 160" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#folder-icon" x="25" y="148" />
    <text x="53" y="163" font-weight="bold" fill="#0f172a">scripts/</text>
    <path d="M 35 172 L 35 185 L 50 185" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#file-icon" x="50" y="173" />
    <text x="73" y="187" fill="#0f172a">deploy.js</text>
    <text x="260" y="187" fill="#64748b"># Deploys contracts &amp; exports ABIs to frontend</text>

    <!-- Branch: test/ -->
    <path d="M 10 210 L 25 210" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#folder-icon" x="25" y="198" />
    <text x="53" y="213" font-weight="bold" fill="#0f172a">test/</text>
    <path d="M 35 222 L 35 235 L 50 235" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#file-icon" x="50" y="223" />
    <text x="73" y="237" fill="#0f172a">PoolPass.test.js</text>
    <text x="260" y="237" fill="#64748b"># 11 automated unit &amp; integration test specifications</text>

    <!-- Branch: diagrams/ -->
    <path d="M 10 260 L 25 260" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#folder-icon" x="25" y="248" />
    <text x="53" y="263" font-weight="bold" fill="#0f172a">diagrams/</text>
    <text x="260" y="263" fill="#64748b"># Academic methodology figures &amp; PNG exports</text>

    <!-- Branch: frontend/ -->
    <path d="M 10 285 L 10 520 L 25 520" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 10 285 L 25 285" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#folder-icon" x="25" y="273" />
    <text x="53" y="288" font-weight="bold" fill="#0f172a">frontend/</text>
    <text x="260" y="288" fill="#64748b"># React 19 + Ethers.js v6 + Tailwind CSS dApp</text>

    <!-- frontend sub-branches -->
    <path d="M 35 298 L 35 480 L 50 480" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    
    <!-- frontend/src/ -->
    <path d="M 35 310 L 50 310" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#folder-icon" x="50" y="298" />
    <text x="78" y="313" font-weight="bold" fill="#0f172a">src/components/</text>

    <!-- components -->
    <path d="M 60 323 L 60 460 L 75 460" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    
    <path d="M 60 335 L 75 335" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#jsx-icon" x="75" y="323" />
    <text x="98" y="337" fill="#2563eb">Header.jsx</text>
    <text x="320" y="337" fill="#64748b"># Universal 3-column navigation &amp; wallet capsule</text>

    <path d="M 60 360 L 75 360" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#jsx-icon" x="75" y="348" />
    <text x="98" y="362" fill="#2563eb">HomeOverview.jsx</text>
    <text x="320" y="362" fill="#64748b"># Executive portfolio savings &amp; deadlines dashboard</text>

    <path d="M 60 385 L 75 385" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#jsx-icon" x="75" y="373" />
    <text x="98" y="387" fill="#2563eb">ActiveSubscription.jsx</text>
    <text x="320" y="387" fill="#64748b"># Fast-forward playback &amp; streaming yield ticker</text>

    <path d="M 60 410 L 75 410" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#jsx-icon" x="75" y="398" />
    <text x="98" y="387" fill="#2563eb" y="412">PlanSelector.jsx</text>
    <text x="320" y="412" fill="#64748b"># Duration matrix &amp; custom plan modal (Gemini Pro)</text>

    <path d="M 60 435 L 75 435" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#jsx-icon" x="75" y="423" />
    <text x="98" y="437" fill="#2563eb">ProtocolTreasuryView.jsx</text>
    <text x="320" y="437" fill="#64748b"># Protocol TVL &amp; treasury revenue analytics</text>

    <use href="#jsx-icon" x="75" y="448" />
    <text x="98" y="462" fill="#2563eb">DevSandbox.jsx</text>
    <text x="320" y="462" fill="#64748b"># Local node time-travel &amp; RPC debugger drawer</text>

    <!-- frontend/src/utils/web3.js -->
    <path d="M 35 485 L 50 485" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#file-icon" x="50" y="473" />
    <text x="73" y="487" fill="#0f172a">src/utils/web3.js</text>
    <text x="260" y="487" fill="#64748b"># Ethers.js integration, formatters &amp; EVM time-travel</text>

    <!-- Root config files -->
    <path d="M 10 535 L 25 535" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#file-icon" x="25" y="523" />
    <text x="48" y="537" fill="#0f172a">hardhat.config.js</text>
    <text x="260" y="537" fill="#64748b"># Solidity 0.8.20 compiler &amp; localhost network config</text>

    <path d="M 10 560 L 25 560" fill="none" stroke="#cbd5e1" stroke-width="1.2" />
    <use href="#file-icon" x="25" y="548" />
    <text x="48" y="562" fill="#0f172a">PROJECT_REPORT.md</text>
    <text x="260" y="562" fill="#64748b"># Comprehensive academic laboratory project report</text>

  </g>

  <!-- Caption below card -->
  <text x="475" y="695" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Figure 5.1. PoolPass project repository directory structure.
  </text>
</svg>