<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PoolPass Methodology Figures - Print Quality Exporter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 60px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }
    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    button {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #334155;
    }
    img, svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Figure 4.1 -->
    <div class="card" id="card-fig1">
      <div class="header">
        <h2>Figure 4.1. PoolPass System Architecture</h2>
        <button onclick="downloadPNG('fig1', 'figure_4_1_system_architecture.png', 2000, 1400)">Download High-Res PNG (2x)</button>
      </div>
      <img id="fig1" src="/diagrams/figure_4_1_system_architecture.svg" alt="Figure 4.1. PoolPass system architecture" width="1000" height="700">
    </div>

    <!-- Figure 4.2 -->
    <div class="card" id="card-fig2">
      <div class="header">
        <h2>Figure 4.2. Subscription, Staking, Yield Harvesting & Principal Recovery Lifecycle</h2>
        <button onclick="downloadPNG('fig2', 'figure_4_2_lifecycle_workflow.png', 2200, 720)">Download High-Res PNG (2x)</button>
      </div>
      <img id="fig2" src="/diagrams/figure_4_2_lifecycle_workflow.svg" alt="Figure 4.2. Subscription, staking, yield harvesting and principal recovery lifecycle workflow" width="1100" height="360">
    </div>

    <!-- Figure 5.1 -->
    <div class="card" id="card-fig3">
      <div class="header">
        <h2>Figure 5.1. PoolPass Project Repository Directory Structure</h2>
        <button onclick="downloadPNG('fig3', 'figure_5_6_project_structure.png', 1900, 1440)">Download High-Res PNG (2x)</button>
      </div>
      <img id="fig3" src="/diagrams/figure_5_6_project_structure.svg" alt="Figure 5.1. PoolPass project repository directory structure" width="950" height="720">
    </div>
  </div>

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script>
    function downloadPNG(imgId, filename, width, height) {
      const img = document.getElementById(imgId);
      const canvas = document.getElementById('exportCanvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      
      const newImg = new Image();
      newImg.crossOrigin = 'anonymous';
      newImg.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(newImg, 0, 0, width, height);
        
        const a = document.createElement('a');
        a.download = filename;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      newImg.src = img.src;
    }
  </script>
</body>
</html>
